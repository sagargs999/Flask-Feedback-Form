{% extends "base.html" %}

{% block title %}Feedback PAGE{% endblock %}

{% block content %}
    <h2>Send us a Feedback</h2>
    <form method="POST" action="/feedback">
        <label for="username">Name:</label><br><br>
        <input type="text" id="username" name="username" placeholder="Enter your name" ><br><br>
        <label for="message">Message:</label><br><br>
       <input type="text" id="message" name="message" placeholder="Enter your feedback" ><br><br>
        <input type="submit" value="Submit">
    </form>
{% endblock %}
